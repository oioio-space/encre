# mise — single source of truth for the toolchain, env, and project commands.
# Docs: https://mise.jdx.dev
#
#   mise run setup      # install tools + wire git hooks (one-shot bootstrap)
#   mise run            # list available tasks
#   mise run lint       # full Go style-guide gate
#   mise run ci         # everything CI runs (lint + scans + tests + coverage)
#
# Token optimization: build/test/lint tasks route through scripts/rtkx.sh, which uses
# `rtk err` when rtk is installed (compact output, exit code preserved) and runs raw
# otherwise. Install rtk with `mise run tools:rtk` (optional, never blocks).

min_version = "2024.1.0"

[settings]
experimental = true

# ── Tools ─────────────────────────────────────────────────────────────────────
[tools]
go            = "1.27.1"
gh            = "latest"
golangci-lint = "2.13.2"
gofumpt       = "latest"
shellcheck    = "latest"
gitleaks      = "latest"
"go:github.com/securego/gosec/v2/cmd/gosec" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck"      = "latest"
# x/perf has no tagged releases — "latest" breaks mise's go-backend resolution; pin the pseudo-version.
"go:golang.org/x/perf/cmd/benchstat"        = "v0.0.0-20260709024250-82a0b07e230d"
"go:github.com/dkorunic/betteralign/cmd/betteralign" = "latest"
syft          = "latest"
grype         = "latest"
gotestsum     = "latest"
actionlint    = "latest"
yamlfmt       = "latest"
watchexec     = "latest"
goreleaser    = "latest"

# ── Environment ───────────────────────────────────────────────────────────────# Mutation testing (mise run mutate) — not a commit gate, see [tasks.mutate].
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "latest"

[env]
GOFLAGS = "-mod=readonly"
# Absolute rule: this project is pure Go. CGO off everywhere (build, test, release).
CGO_ENABLED = "0"
# Minimum test coverage enforced by `mise run cover:check` / CI (cmd/ excluded).
COVER_MIN = "85"
_.path = ["{{ env.HOME }}/go/bin"]

# ── Hooks ─────────────────────────────────────────────────────────────────────
[hooks]
enter = "git config core.hooksPath .githooks >/dev/null 2>&1 || true"

# ── Tasks ─────────────────────────────────────────────────────────────────────
[tasks.mutate]
description = "Mutation testing (gremlins) on the logic packages — MSI_MIN fails below a score. Deliberately NOT in ci: a gate here rewards padding the score"
run = "./scripts/mutate.sh"

[tasks.fmt]
description = "Format all Go code with gofumpt"
run = "gofumpt -w ."

[tasks.vet]
description = "go vet"
run = "./scripts/rtkx.sh go vet ./..."

[tasks.build]
description = "Build all packages"
run = "./scripts/rtkx.sh go build ./..."

[tasks.align]
description = "Reorder struct fields for optimal memory alignment (betteralign -apply)"
run = "betteralign -apply ./... && gofumpt -w ."

[tasks."align:check"]
description = "Report structs whose field order wastes memory (betteralign, no changes)"
run = "betteralign ./..."

[tasks.gen]
description = "go generate over the module"
run = "go generate ./..."

[tasks."gen:check"]
description = "Verify committed generated files match the generators (fails on drift)"
run = "go generate ./... && git diff --exit-code"

[tasks.test]
description = "Run tests (gotestsum, readable output)"
run = "./scripts/rtkx.sh gotestsum --format pkgname -- ./..."

[tasks."test:ci"]
description = "Run tests once, producing a JUnit report AND coverage.out"
run = "./scripts/rtkx.sh gotestsum --junitfile junit.xml --format pkgname -- -short -timeout=8m -covermode=atomic -coverprofile=coverage.out ./..."

[tasks."test:watch"]
description = "Re-run tests on every file change (TDD loop)"
run = "mise watch -t test"

[tasks.bench]
description = "Run Go benchmarks (-benchmem); set BENCH_PATTERN to filter"
run = "./scripts/bench.sh run"

[tasks."bench:baseline"]
description = "Run benchmarks and save bench-baseline.txt (before optimizing)"
run = "./scripts/bench.sh baseline"

[tasks."bench:compare"]
description = "Run benchmarks and benchstat vs baseline (after optimizing)"
run = "./scripts/bench.sh compare"

[tasks.cover]
description = "Test coverage report (coverage.out + total %)"
run = "./scripts/cover.sh"

[tasks."cover:check"]
description = "Enforce minimum coverage (COVER_MIN); reuses coverage.out from test:ci"
depends = ["test:ci"]
run = "./scripts/cover.sh --check"

[tasks."lexique:build"]
description = "Rebuild the embedded French lexicon from Lexique 3.83 (CC BY-SA 4.0)"
run = """
set -euo pipefail
src="${LEXIQUE_TSV:-Lexique383.tsv}"
if [ ! -f "$src" ]; then
  echo "Lexique383.tsv introuvable. Télécharge http://www.lexique.org/databases/Lexique383/Lexique383.zip" >&2
  echo "puis relance avec LEXIQUE_TSV=/chemin/Lexique383.tsv mise run lexique:build" >&2
  exit 1
fi
go run ./cmd/lexique-gen -in "$src" -out lexique/data/lexique.tsv.gz
"""

[tasks.lint]
description = "Google Go style-guide gate (gofmt + vet + golangci-lint + build)"
run = "./scripts/rtkx.sh ./scripts/lint.sh"

[tasks."lint:staged"]
description = "Style-guide gate on staged files only (used by the git pre-commit hook)"
run = "./scripts/rtkx.sh ./scripts/lint.sh --staged"

[tasks."lint:sh"]
description = "Lint the bash hook scripts with shellcheck"
# .beads/hooks/* are the shims that delegate to .githooks — they carry the whole
# gate chain, so a broken one must fail the build, not silently skip every gate.
run = "shellcheck -x --source-path=SCRIPTDIR .githooks/* .beads/hooks/* .claude/hooks/*.sh .claude/hooks/lib/*.sh scripts/*.sh deploy/*.sh"

[tasks."lint:yaml"]
description = "Lint YAML config formatting with yamlfmt"
run = "yamlfmt -lint .golangci.yml .github/workflows"

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks."scan:secrets"]
description = "Scan full git history for leaked secrets (gitleaks)"
run = "./scripts/rtkx.sh gitleaks git --redact ."

[tasks."scan:secrets:staged"]
description = "Scan staged changes for secrets (pre-commit gate)"
run = "./scripts/rtkx.sh gitleaks git --staged --redact"

[tasks."scan:code"]
description = "Code vuln scan: gosec (SAST) + govulncheck (reachable CVEs)"
run = "./scripts/sec-scan.sh"

[tasks."scan:code:staged"]
description = "Code vuln scan on staged Go (pre-commit gate)"
run = "./scripts/sec-scan.sh --staged"

[tasks.sbom]
description = "Generate a CycloneDX SBOM (syft)"
run = "syft scan dir:. -o cyclonedx-json=sbom.cdx.json -q"

[tasks."scan:sbom"]
description = "Scan the SBOM for CVEs (grype) — fails on high/critical"
depends = ["sbom"]
run = "./scripts/rtkx.sh grype sbom:sbom.cdx.json --fail-on high"

[tasks."cgo:check"]
description = "Absolute rule gate: fail if any package uses CGO (project is pure Go)"
run = "./scripts/cgo-check.sh"

[tasks.ci]
description = "Everything CI must pass"
depends = ["cgo:check", "scan:secrets", "scan:code", "scan:sbom", "lint", "lint:sh", "lint:yaml", "lint:actions", "test:ci", "cover:check", "check-gates-intact", "gates:test"]

[tasks.release]
description = "Cross-platform release build + publish (goreleaser)"
run = "goreleaser release --clean"

[tasks."release:snapshot"]
description = "Local cross-platform build, no publish (goreleaser)"
run = "goreleaser release --snapshot --clean"

[tasks."tools:rtk"]
description = "Best-effort install of rtk (token-optimized task output) — never blocks"
run = '''
if command -v rtk >/dev/null 2>&1; then
  echo "✓ rtk already available: $(rtk --version 2>/dev/null)"
  exit 0
fi
echo "Installing rtk from GitHub releases (prebuilt, non-blocking)…"
mise use -g "github:rtk-ai/rtk@latest" >/dev/null 2>&1 \
  && echo "✓ rtk installed via mise (github releases)" \
  || echo "⚠ rtk not installed — tasks still run, just without token optimization."
exit 0
'''

[tasks.gh]
description = "GitHub CLI via mise + rtk (use: mise run gh -- pr list)"
run = "./scripts/ghx.sh"

[tasks.clean]
description = "Remove regenerable build/scan artifacts + go build cache"
run = "./scripts/clean-artifacts.sh"

[tasks."clean:check"]
description = "Pre-commit gate: tidy artifacts + block any staged artifact"
run = "./scripts/clean-artifacts.sh --check"

[tasks."wasm:build"]
description = "Build the client for the browser into dist/web (ticket T00, ENCRE_04 §2)"
# wasm_exec.js is the Go runtime's own shim and must match the toolchain that
# produced the .wasm, so it is copied from GOROOT at build time, never vendored.
#
# Every asset under dist/web/static is named with a content hash: that is
# what makes deploy/Caddyfile's `Cache-Control: public, max-age=31536000,
# immutable` on /static/* honest instead of a lie a redeploy would break. The
# hash also seeds web/sw.js's CACHE_NAME, so a new build gets its own service
# worker cache and the previous one is dropped on activate.
run = """
set -euo pipefail
rm -rf dist/web
mkdir -p dist/web/static
GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o dist/web/static/encre.wasm ./cmd/client
HASH=$(sha256sum dist/web/static/encre.wasm | cut -c1-12)
mv dist/web/static/encre.wasm "dist/web/static/encre.$HASH.wasm"
cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" "dist/web/static/wasm_exec.$HASH.js"
sed "s/__HASH__/$HASH/g" web/index.html > dist/web/index.html
sed "s/__HASH__/$HASH/g" web/sw.js > dist/web/sw.js
# Pre-compressed once here rather than per request: the wasm is tens of MB,
# and gzipping it on every fetch would cost more than it saves. Caddy adds
# zstd/gzip negotiation in front in production (deploy/Caddyfile); cmd/serve
# (phone/tablet dev server) and cmd/server both fall back to these .gz
# siblings via internal/httpstatic.
gzip -9 -kf "dist/web/static/encre.$HASH.wasm"
gzip -9 -kf "dist/web/static/wasm_exec.$HASH.js"
printf 'dist/web/static: %s de wasm (brut), %s en gzip — hash %s\n' \
  "$(du -h "dist/web/static/encre.$HASH.wasm" | cut -f1)" \
  "$(du -h "dist/web/static/encre.$HASH.wasm.gz" | cut -f1)" "$HASH"
"""

[tasks."wasm:serve"]
description = "Build the client for the browser and serve it on :8080 (phone/tablet test)"
depends = ["wasm:build"]
run = "go run ./cmd/serve"

[tasks."native:build"]
description = "Cross-compile the desktop client (cmd/client) for linux/darwin/windows into dist/bin"
# CGO_ENABLED=0 is already pinned in [env]; Ebitengine's non-wasm targets
# link against the OS's own GL/audio libraries at runtime (not at compile
# time), so a pure-Go cross-compile from Linux works for all three.
run = """
set -euo pipefail
mkdir -p dist/bin
for goos_goarch in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
  goos="${goos_goarch%/*}"; goarch="${goos_goarch#*/}"
  ext=""; [ "$goos" = "windows" ] && ext=".exe"
  out="dist/bin/encre-client-$goos-$goarch$ext"
  echo "building $out"
  GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/client
done
du -h dist/bin/encre-client-*
"""

[tasks."server:build"]
description = "Build the production server binary (cmd/server, ENCRE_04 §12) into dist/bin"
run = """
set -euo pipefail
mkdir -p dist/bin
go build -trimpath -ldflags="-s -w" -o dist/bin/encre-server ./cmd/server
du -h dist/bin/encre-server
"""

[tasks."hooks:install"]
description = "Point git at .githooks, or at .beads/hooks when its shims delegate there"
run = "./scripts/install-hooks.sh"

[tasks."check-gates-intact"]
description = "Fail if an active guardrail vanished without being removed from gates.manifest"
# Also invoked BY PATH from .github/workflows/ci.yml and .githooks/pre-push, on
# purpose: this task's own name lives in `[tasks.ci] depends`, which is one of the
# things the script watches — reachable only from there, deleting one string would
# disable the whole check silently.
run = "./scripts/check-gates-intact.sh"

[tasks."check-gates-intact:test"]
description = "Bite test for check-gates-intact.sh (throwaway fixture repos; runs in ci via gates:test)"
run = "./scripts/check-gates-intact_test.sh"

[tasks."cycle:check"]
description = "Manual run of the development-cycle guardrail, bypassing its 15-minute throttle"
run = "out=$(ENCRE_CYCLE_NOCACHE=1 ./.claude/hooks/cycle-check.sh </dev/null); if [ -z \"$out\" ]; then echo 'rien de dû'; else printf '%s' \"$out\" | jq -r '.hookSpecificOutput.additionalContext'; fi"

[tasks."cycle:check:test"]
description = "Bite test for cycle-check.sh (throwaway fixture repos + stub bd; runs in ci via gates:test)"
run = "./.claude/hooks/cycle-check_test.sh"

[tasks."gates:test"]
description = "Run every guardrail bite test — the gates that guard the gates"
# In `ci`: a guardrail-inventory check that is itself unverified is one more
# thing held by convention.
depends = ["commit-msg:test", "check-gates-intact:test", "cycle:check:test"]
run = "echo '✓ tous les tests de morsure sont passés'"

[tasks."commit-msg:test"]
description = "Bite test for the Bead: trailer gate (what it must refuse AND accept)"
# In `ci` via gates:test, but the Dolt database is gitignored, so a fresh CI clone
# has no beads to verify ids against: there the test SKIPS loudly (exit 0) rather
# than failing. It only does real work locally — which is where the gate fires.
run = "./.githooks/commit-msg_test.sh"

[tasks."beads:export"]
description = "Refresh the .beads/issues.jsonl snapshot that travels in git"
# Durable sync is `bd dolt push` (refs/dolt/data on origin, wired 2026-09-13);
# this JSONL is the readable, reviewable export that rides in the git tree — it
# is what makes a bead change visible in a diff. Re-run before committing when
# beads changed; the pre-commit beads block also refreshes it.
run = "bd export -o .beads/issues.jsonl"

[tasks.setup]
description = "One-shot bootstrap: install tools + wire git hooks (+ optional rtk)"
depends = ["hooks:install", "tools:rtk"]
run = "mise install"
